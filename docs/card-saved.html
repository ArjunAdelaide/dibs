<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card saved</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #f2f4f8;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: min(88vw, 360px); text-align: center; }
  .tick { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #1f8f5f; display: grid; place-items: center; font-size: 34px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 0 0 28px; color: #a9b1c0; }
  a { display: block; padding: 15px 20px; border-radius: 14px; background: #2f7cf6; color: #fff; text-decoration: none; font-weight: 600; }
  small { display: block; margin-top: 18px; color: #6f7888; }
</style>
</head>
<body>
<main>
  <div class="tick" aria-hidden="true">✓</div>
  <h1>Card saved</h1>
  <p>Go back to your chat with Dibs and reply YES to finish the booking.</p>
  <a id="back" href="sms:">Back to Messages</a>
  <small>Stripe keeps your card details. Dibs never sees them.</small>
</main>
<script>
  // ?to=<the agent's iMessage address> opens the chat with YES typed in, ready to send.
  var to = new URLSearchParams(location.search).get("to");
  if (to && /^[A-Za-z0-9+@._-]+$/.test(to)) document.getElementById("back").href = "sms:" + to + "&body=YES";
</script>
</body>
</html>
